name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nof1
          POSTGRES_PASSWORD: nof1
          POSTGRES_DB: nof1_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U nof1 -d nof1_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL_TEST: postgresql+psycopg://nof1:nof1@localhost:5432/nof1_test
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.10.2"
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "20.19.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: make setup
      - run: make check
      - run: make eval-regression
  containers:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build local container images
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            cp .env.example .env
            docker compose build
          else
            echo "Docker is unavailable on this runner; local build verification is required."
          fi
