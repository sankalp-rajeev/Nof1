services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: nof1
      POSTGRES_PASSWORD: nof1
      POSTGRES_DB: nof1
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nof1 -d nof1"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  postgres_data:
